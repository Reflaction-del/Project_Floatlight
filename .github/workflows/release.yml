name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      HUSKY: 0
      NODE_OPTIONS: --max-old-space-size=4096
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Electron 下载缓存重定向到 workspace 相对路径（Windows 默认在 %LOCALAPPDATA%，
      # 不重定向则 actions/cache 找不到、缓存不命中）。key 按 lockfile hash + OS 分隔，
      # 保持稳定避免 winCodeSign 的 signtool.exe ENOENT（electron-builder #4955）。
      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/electron
          key: electron-win-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-win-
      - name: Cache electron-builder downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/electron-builder
          key: electron-builder-win-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-builder-win-
      # dist:win = npm run build && electron-builder --win（走 package.json 的 build 段：
      # nsis + portable、${version} 宏、asar:true）。不用遗留 electron-builder.config.cjs。
      # 不加 --publish、不注入 GH_TOKEN：electron-builder 24 无 publish 配置时不自动发布，
      # 发版由 release job 的 softprops/action-gh-release 接管。
      - name: Build Windows installers
        run: npm run dist:win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build
          path: release/*.exe

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      # 版本号取 package.json（AGENTS.md §6 真相源唯一），不解析 tag 名，避免 tag 与 package.json 不一致时命名错位
      - name: Get version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            windows-build/*.exe
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          make_latest: ${{ !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha')) }}
