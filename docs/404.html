<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面未找到 - 浮光世界观编辑器</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --bg: #0a0a0c;
      --text: #f5f3ef;
      --muted: #7a7569;
      --accent: #d4a853;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f7f5f0; --text: #1a1917; --muted: #8a867c; --accent: #b8892f; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 440px; }
    h1 { font-size: 72px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
    h2 { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
    p { color: var(--muted); margin-bottom: 28px; line-height: 1.7; }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: var(--accent);
      color: #0a0a0c;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>这个世界观里还没有这个页面</h2>
    <p>你访问的页面可能已经移动、更名，或者从未存在过。</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
