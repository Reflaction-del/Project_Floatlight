<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面未找到 - 浮光世界观编辑器</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --paper: #0a0a0c;
      --ink: #f5f3ef;
      --ink-2: #c8c4bc;
      --ink-3: #7a7569;
      --accent: #c9a45c;
      --accent-2: #d4a853;
      --line: #2a2620;
    }
    body {
      font-family: Georgia, "Source Serif Pro", "Songti SC", "STSong", serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background-image: radial-gradient(circle at 1px 1px, rgba(245,243,239,0.035) 1px, transparent 0);
      background-size: 24px 24px;
    }
    .container { max-width: 480px; }
    .ch-num { font-family: Georgia, serif; font-size: 96px; font-style: italic; color: var(--accent); line-height: 1; margin-bottom: 24px; font-weight: 400; }
    h1 { font-size: 28px; font-weight: 400; margin-bottom: 16px; line-height: 1.3; }
    p { color: var(--ink-2); margin-bottom: 32px; line-height: 1.7; font-size: 16px; font-style: italic; }
    a {
      display: inline-block;
      padding: 14px 28px;
      background: var(--accent);
      color: var(--paper);
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.05em;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      transition: all 0.2s;
    }
    a:hover { background: var(--accent-2); }
    .rule { width: 40px; height: 1px; background: var(--accent); margin: 0 auto 32px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="ch-num">404</div>
    <div class="rule"></div>
    <h1>这个世界观里还没有这个页面</h1>
    <p>你访问的页面可能已经移动、更名，或者从未存在过。</p>
    <a href="./">返回首页</a>
  </div>
</body>
</html>
